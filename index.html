<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dead Center</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Animated diamond background -->
  <canvas id="bg-canvas"></canvas>

  <!-- ============ MAIN MENU ============ -->
  <section id="screen-menu" class="screen active">
    <div class="menu-content">
      <img src="assets/logo.png" alt="Dead Center" class="logo" id="logo-img" />
      <button id="play-btn" class="play-btn-wrap" aria-label="Play">
        <img src="assets/play_button.png" alt="Play" />
      </button>
      <div class="menu-footer">v1.0 &middot; move to intercept, freeze on the beat</div>
    </div>
  </section>

  <!-- ============ LEVEL SELECT ============ -->
  <section id="screen-select" class="screen">
    <div class="select-layout">

      <!-- LEFT PANEL -->
      <div class="left-panel" id="left-panel">
        <button class="back-btn" id="back-to-menu" aria-label="Back">&#10094;</button>

        <div class="cover-frame">
          <img id="sel-cover" class="sel-cover-img" src="" alt="" />
          <div class="cover-glow"></div>
        </div>

        <h1 id="sel-title" class="sel-title">&nbsp;</h1>
        <div class="sel-meta">
          <div class="meta-chip">
            <span class="meta-label">Completion</span>
            <span class="meta-value" id="sel-completion">0.000%</span>
          </div>
          <div class="meta-chip">
            <span class="meta-label">High Score</span>
            <span class="meta-value" id="sel-highscore">&mdash;</span>
          </div>
        </div>

        <button id="start-song-btn" class="start-btn">
          <span>PLAY</span>
        </button>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel">
        <div class="right-panel-header">Select Track</div>
        <div id="song-list" class="song-list">
          <!-- songs injected here -->
        </div>
      </div>

    </div>
  </section>

  <!-- ============ GAMEPLAY ============ -->
  <section id="screen-game" class="screen">
    <div class="game-hud">
      <div class="hud-left">
        <div class="hud-song-title" id="hud-song-title">&nbsp;</div>
        <button id="quit-btn" class="quit-btn">Quit</button>
      </div>
      <div class="hud-right">
        <div class="hud-score-label">SCORE</div>
        <div class="hud-score" id="hud-score">0</div>
        <div class="hud-combo" id="hud-combo"></div>
      </div>
    </div>

    <div class="arena-wrap" id="arena-wrap">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="game-overlay" class="game-overlay hidden">
      <div class="overlay-card">
        <div class="overlay-title" id="overlay-title">Cleared</div>
        <div class="overlay-stats">
          <div class="ostat"><span>Accuracy</span><b id="overlay-acc">0%</b></div>
          <div class="ostat"><span>Score</span><b id="overlay-score">0</b></div>
          <div class="ostat"><span>Best Combo</span><b id="overlay-combo">0</b></div>
        </div>
        <div class="overlay-btns">
          <button id="overlay-retry" class="ov-btn">Retry</button>
          <button id="overlay-exit" class="ov-btn ov-secondary">Level Select</button>
        </div>
      </div>
    </div>

    <div id="countdown" class="countdown hidden"></div>
  </section>

  <audio id="audio-player" preload="auto"></audio>
  <audio id="menu-audio-player" src="https://raw.githubusercontent.com/NecroHub/Audio/main/YTDown.com_YouTube_The-Grand-Affair-Coupe-NO-COPYRIGHT-8-bi_Media_flY2S22Q3DU_001_1080p.mp3" loop preload="auto"></audio>

  <script src="js/background.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/chartgen.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/levelselect.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
